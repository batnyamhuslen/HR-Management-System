<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <svg class="login-logo" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
      <h2>HR CORE</h2>
      <p class="login-subtitle">Нэвтрэх</p>
    </div>

    <form [formGroup]="form">
      <div class="input-group">
        <label>Нэвтрэх нэр</label>
        <input type="text" formControlName="username" placeholder="Нэвтрэх нэрээ оруулна уу" />
      </div>

      <div class="input-group">
        <label>Нууц үг</label>
        <input type="password" formControlName="password" placeholder="Нууц үгээ оруулна уу" />
      </div>

      <p class="error-msg" *ngIf="error">{{ error }}</p>

      <button class="login-btn" [disabled]="loading || form.invalid" (click)="onLogin()">
        <span *ngIf="!loading">Нэвтрэх</span>
        <span *ngIf="loading">Түр хүлээнэ үү...</span>
      </button>
    </form>
  </div>
</div>
