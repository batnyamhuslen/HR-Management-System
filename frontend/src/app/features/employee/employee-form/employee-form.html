<h2 mat-dialog-title>{{ isEdit ? 'Мэдээлэл засах' : 'Ажилтан нэмэх' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Бүтэн нэр</mat-label>
      <input matInput formControlName="fullName" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Нас</mat-label>
      <input matInput type="number" formControlName="age" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Утас</mat-label>
      <input matInput formControlName="phone" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Имэйл</mat-label>
      <input matInput formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Хаяг</mat-label>
      <input matInput formControlName="address" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ажилд орсон огноо</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="hireDate" />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Болих</button>
  <button mat-raised-button color="primary"
          [disabled]="form.invalid"
          (click)="save()">Хадгалах</button>
</mat-dialog-actions>
