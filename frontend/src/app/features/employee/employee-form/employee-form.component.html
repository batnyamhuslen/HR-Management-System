<h2 mat-dialog-title class="dialog-title">{{ isEdit ? 'Мэдээлэл засах' : 'Ажилтан нэмэх' }}</h2>

<mat-dialog-content class="dialog-content">
  <form [formGroup]="form">
    <div class="form-row">
      <div class="input-group">
        <label>Бүтэн нэр</label>
        <input type="text" formControlName="fullName" placeholder="Бүтэн нэр" />
      </div>
      <div class="input-group">
        <label>Нас</label>
        <input type="number" formControlName="age" placeholder="Нас" />
      </div>
    </div>
    <div class="form-row">
      <div class="input-group">
        <label>Утас</label>
        <input type="text" formControlName="phone" placeholder="Утасны дугаар" />
      </div>
      <div class="input-group">
        <label>Имэйл</label>
        <input type="email" formControlName="email" placeholder="имэйл@example.com" />
      </div>
    </div>
    <div class="input-group">
      <label>Хаяг</label>
      <input type="text" formControlName="address" placeholder="Хаяг" />
    </div>
    <div class="input-group">
      <label>Ажилд орсон огноо</label>
      <input type="date" formControlName="hireDate" />
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button class="btn-cancel" mat-dialog-close>Болих</button>
  <button class="btn-primary" [disabled]="form.invalid" (click)="save()">Хадгалах</button>
</mat-dialog-actions>
